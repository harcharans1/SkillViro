<header class="site-nav">
  <div class="nav-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="brand-mark">S</span>
      <span>Skill<span>Viro</span></span>
    </a>

    <button class="menu-btn" type="button" aria-label="Toggle menu" (click)="toggleMenu()">☰</button>

    <nav [class.open]="menuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()">Home</a>
      <a routerLink="/courses" routerLinkActive="active" (click)="closeMenu()">Courses</a>
      <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Projects</a>
      <a routerLink="/tools" routerLinkActive="active" (click)="closeMenu()">Tools</a>
      <a routerLink="/career" routerLinkActive="active" (click)="closeMenu()">Career</a>
    </nav>

    <div class="nav-actions">
      <a routerLink="/login" class="login-link">Login</a>
      <a routerLink="/register" class="btn btn-primary">Get Started</a>
    </div>
  </div>
</header>
