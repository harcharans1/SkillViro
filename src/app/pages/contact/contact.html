<div class="page contact-page"><section class="section"><div class="container contact-grid"><div><span class="eyebrow">CONTACT</span><h1>Let's build something useful.</h1><p class="muted">Have a question, feedback or a project idea? Send a message.</p><div class="contact-note"><strong>Response</strong><span>We’ll use this frontend form for the first version. A backend API can be connected later.</span></div></div><form class="contact-form card" (submit)="$event.preventDefault(); submit()"><label>Name<input required placeholder="Your name"></label><label>Email<input required type="email" placeholder="you@example.com"></label><label>Message<textarea required rows="6" placeholder="Tell us what you need..."></textarea></label><button class="btn btn-primary" type="submit">{{ sent() ? 'Message sent ✓' : 'Send message →' }}</button>@if(sent()){<p class="success">Thanks! Your message has been captured in the frontend demo.</p>}</form></div></section></div>
