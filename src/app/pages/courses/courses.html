<div class="page">
  <section class="listing-hero"><div class="container"><span class="eyebrow">COURSES</span><h1>Learn skills that <span>move you forward.</span></h1><p>Structured, practical learning paths for web development, programming and modern application building.</p></div></section>
  <section class="section"><div class="container">
    <div class="filters">
      <input type="search" placeholder="Search courses..." (input)="search($event)">
      <div class="chips">@for (category of categories; track category) { <button [class.active]="selected() === category" (click)="selected.set(category)">{{ category }}</button> }</div>
    </div>
    <div class="course-grid">
      @for (course of filtered(); track course.id) { <app-course-card [course]="course" /> } @empty { <div class="empty">No courses match your search.</div> }
    </div>
  </div></section>
</div>
