<div class="page">
  <section class="listing-hero"><div class="container"><span class="eyebrow">PROJECT LAB</span><h1>Build projects. <span>Prove your skills.</span></h1><p>Follow practical project roadmaps with requirements, tasks and clear outcomes.</p></div></section>
  <section class="section"><div class="container">
    <div class="filters"><input type="search" placeholder="Search projects..." (input)="search($event)"><div class="chips">@for (filter of filters; track filter) { <button [class.active]="selected() === filter" (click)="selected.set(filter)">{{ filter }}</button> }</div></div>
    <div class="project-grid">@for (project of filteredProjects(); track project.id) { <app-project-card [project]="project" /> } @empty { <div class="empty">No projects match your search.</div> }</div>
  </div></section>
</div>
